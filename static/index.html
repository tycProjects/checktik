<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFF8EF" />
<title>Video check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8EF;
    --ink: #17140F;
    --line: #17140F;
    --coral: #FF8F76;
    --mint: #7BE0C4;
    --cream: #FFFDF6;
    --purple: #A98CF7;
    --amber: #FFB13C;
    --muted: #6B675F;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Baloo 2', var(--mono), sans-serif;
  }
  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 26px 16px 60px;
  }
  main { width: 100%; max-width: 480px; }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 4px 4px 14px;
  }

  .search-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    border: 2.5px solid var(--line);
    border-radius: 999px;
    padding: 4px 6px 4px 16px;
    margin-bottom: 12px;
  }
  .search-pill svg { flex-shrink: 0; opacity: 0.55; }
  input[type="url"] {
    flex: 1;
    border: none;
    background: none;
    outline: none;
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 11px 0;
    color: var(--ink);
    min-width: 0;
  }
  input[type="url"]::placeholder { color: #B5AFA2; }

  .btn {
    border: 2.5px solid var(--line);
    border-radius: 999px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 13px 18px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--line);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--line);
  }
  .btn:disabled { opacity: 0.75; cursor: default; }
  .btn.block { width: 100%; }

  .btn-coral { background: var(--coral); color: var(--ink); margin-bottom: 12px; }
  .btn-mint { background: var(--mint); color: var(--ink); }
  .btn-cream { background: var(--cream); color: var(--ink); }
  .btn-purple { background: var(--purple); color: #fff; margin-top: 12px; }

  .two-up { display: flex; gap: 10px; }
  .two-up .btn { flex: 1; font-size: 0.82rem; padding: 11px 10px; }

  .dash-loader {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2.5px dashed currentColor;
    animation: spin 1s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    display: none;
    align-items: center;
    gap: 10px;
    background: #DFF9EF;
    border: 2.5px dashed var(--line);
    border-radius: 16px;
    padding: 13px 16px;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: #0E5C46;
    margin-top: 16px;
  }
  .status.show { display: flex; }

  .error {
    display: none;
    background: #FFE2DC;
    border: 2.5px solid var(--line);
    border-radius: 16px;
    padding: 13px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 16px;
  }
  .error.show { display: block; }

  #resultWrap { display: none; margin-top: 18px; }
  #resultWrap.show { display: block; }

  .frame {
    border: 2.5px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    background: #111;
    box-shadow: 5px 5px 0 var(--line);
    margin-bottom: 14px;
  }
  .frame-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    background: #111;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #FF5F57; }
  .dot.yellow { background: #FFBD2E; }
  .dot.green { background: #28C840; }
  .frame-addr {
    margin-left: 8px;
    color: #C9C9C9;
    font-family: var(--mono);
    font-size: 0.72rem;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .frame img {
    display: block;
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    background: #1c1c1c;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: -2px; position: relative; z-index: 1; padding: 0 2px; }
  .tab {
    border: 2.5px solid var(--line);
    border-bottom: none;
    border-radius: 14px 14px 0 0;
    padding: 9px 16px;
    font-weight: 700;
    font-size: 0.85rem;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tab.active { background: var(--ink); color: #fff; }
  .badge {
    background: var(--amber);
    color: var(--ink);
    border-radius: 999px;
    font-size: 0.72rem;
    padding: 1px 7px;
    font-weight: 700;
  }
  .tab.active .badge { background: var(--amber); color: var(--ink); }

  .panel {
    background: var(--cream);
    border: 2.5px solid var(--line);
    border-radius: 0 16px 16px 16px;
    box-shadow: 4px 4px 0 var(--line);
    padding: 14px;
  }

  .file-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 0.78rem;
    margin-bottom: 12px;
    max-width: 100%;
  }
  .file-chip .dot-sm { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); flex-shrink: 0; }
  .file-chip span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 2px dashed #E4DCCB;
    font-size: 0.88rem;
  }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); font-weight: 600; }
  .row .value { font-family: var(--mono); font-weight: 600; text-align: right; }

  .skeleton .row .value, .skeleton .file-chip span.name {
    display: inline-block;
    width: 70px;
    height: 12px;
    border-radius: 4px;
    background-image: repeating-linear-gradient(45deg, #EFE7D6 0 6px, #F7F1E4 6px 12px);
    color: transparent;
  }

  #panelBody[hidden], #formatsBody[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Video check</h1>

  <form id="checkForm">
    <div class="search-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="url" id="urlInput" placeholder="paste a tiktok link" required />
    </div>

    <button type="submit" class="btn btn-coral block" id="submitBtn">
      <span class="dash-loader" id="spinner" style="display:none"></span>
      <span id="btnLabel">Check</span>
    </button>
  </form>

  <div class="two-up">
    <button class="btn btn-mint" id="copyBtn" type="button">Copy details</button>
    <button class="btn btn-cream" id="openBtn" type="button">Open link</button>
  </div>

  <button class="btn btn-purple block" id="resetBtn" type="button">Check another</button>

  <div class="status" id="status">
    <span class="dash-loader"></span>
    <span>Reading the file…</span>
  </div>
  <div class="error" id="error"></div>

  <div id="resultWrap">
    <div class="frame">
      <div class="frame-bar">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="frame-addr" id="frameAddr">tiktok.com</span>
      </div>
      <img id="thumb" src="" alt="" />
    </div>

    <div class="tabs">
      <button class="tab active" id="tabDetails" type="button">Details</button>
      <button class="tab" id="tabFormats" type="button">Formats <span class="badge" id="formatsCount">0</span></button>
    </div>

    <div class="panel" id="panel">
      <div class="file-chip">
        <span class="dot-sm"></span>
        <span class="name" id="fileName">clip.mp4</span>
      </div>

      <div id="panelBody">
        <div class="row"><span class="label">Resolution</span><span class="value" id="resolution">–</span></div>
        <div class="row"><span class="label">Frame rate</span><span class="value" id="fps">–</span></div>
        <div id="fpsDebug" style="display:none; font-family: var(--mono); font-size: 0.68rem; color: var(--muted); padding: 0 2px 8px; word-break: break-all;"></div>
        <div class="row"><span class="label">Video codec</span><span class="value" id="vcodec">–</span></div>
        <div class="row"><span class="label">Audio codec</span><span class="value" id="acodec">–</span></div>
        <div class="row"><span class="label">Bitrate</span><span class="value" id="bitrate">–</span></div>
        <div class="row"><span class="label">File size</span><span class="value" id="filesize">–</span></div>
        <div class="row"><span class="label">Length</span><span class="value" id="duration">–</span></div>
        <div class="row"><span class="label">Container</span><span class="value" id="ext">–</span></div>
      </div>

      <div id="formatsBody" hidden></div>
    </div>
  </div>
</main>

<script>
const form = document.getElementById('checkForm');
const urlInput = document.getElementById('urlInput');
const submitBtn = document.getElementById('submitBtn');
const spinner = document.getElementById('spinner');
const btnLabel = document.getElementById('btnLabel');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultWrap = document.getElementById('resultWrap');
const panel = document.getElementById('panel');
const tabDetails = document.getElementById('tabDetails');
const tabFormats = document.getElementById('tabFormats');
const panelBody = document.getElementById('panelBody');
const formatsBody = document.getElementById('formatsBody');
const copyBtn = document.getElementById('copyBtn');
const openBtn = document.getElementById('openBtn');
const resetBtn = document.getElementById('resetBtn');

let lastUrl = '';
let lastSummary = '';

function fmtDuration(sec) {
  if (sec == null) return '–';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}
function fmtFps(fps) { return fps ? `${Math.round(fps)} fps` : '–'; }
function fmtBitrate(kbps) {
  if (!kbps) return '–';
  return kbps >= 1000 ? `${(kbps / 1000).toFixed(2)} Mbps` : `${kbps} kbps`;
}

// TikTok's CDN blocks server-side (datacenter) requests, but the visitor's
// own browser can reach it fine — same as watching TikTok normally. So when
// the backend doesn't report an fps, measure it locally by playing a couple
// seconds of the actual clip (muted, hidden) and counting real frames via
// requestVideoFrameCallback.
function measureFpsFromVideo(url, timeoutMs = 9000) {
  return new Promise((resolve) => {
    if (!url) { resolve({ fps: null, reason: 'no play_url from server' }); return; }
    const video = document.createElement('video');
    video.src = url;
    video.preload = 'auto';
    video.muted = true;
    video.defaultMuted = true;
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.referrerPolicy = 'no-referrer';
    video.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:160px;height:90px;';
    document.body.appendChild(video);

    let done = false;
    const finish = (fps, reason) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      video.pause();
      video.remove();
      resolve({ fps, reason: fps ? null : (reason || 'unknown') });
    };
    const timer = setTimeout(() => finish(null, 'timed out waiting for playback (9s)'), timeoutMs);

    // Path 1: requestVideoFrameCallback — precise, but support/timing varies
    // across mobile browsers, so it's raced against Path 2 below.
    if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
      const samples = [];
      const onFrame = (_now, metadata) => {
        samples.push(metadata);
        if (samples.length < 15) { video.requestVideoFrameCallback(onFrame); return; }
        const a = samples[0], b = samples[samples.length - 1];
        const dt = b.mediaTime - a.mediaTime;
        const df = b.presentedFrames - a.presentedFrames;
        if (dt > 0 && df > 0) finish(df / dt);
        else video.requestVideoFrameCallback(onFrame);
      };
      video.requestVideoFrameCallback(onFrame);
    }

    // Path 2: getVideoPlaybackQuality — broader support, used as a fallback
    // (or the primary path where rVFC isn't available).
    let qStart = null;
    video.addEventListener('timeupdate', () => {
      if (typeof video.getVideoPlaybackQuality !== 'function') return;
      const q = video.getVideoPlaybackQuality();
      const sample = { frames: q.totalVideoFrames, time: video.currentTime };
      if (!qStart) { qStart = sample; return; }
      const dt = sample.time - qStart.time;
      const df = sample.frames - qStart.frames;
      if (dt >= 1 && df > 0) finish(df / dt);
    });

    video.addEventListener('canplay', () => {
      video.play().catch((err) => finish(null, `play() failed: ${err}`));
    });
    video.addEventListener('error', () => {
      finish(null, `video failed to load: ${video.error ? video.error.message : 'unknown'}`);
    });
  });
}

function setLoading(loading) {
  submitBtn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  btnLabel.textContent = loading ? 'Checking' : 'Check';
  statusEl.classList.toggle('show', loading);
  if (loading) panel.classList.add('skeleton'); else panel.classList.remove('skeleton');
}

tabDetails.addEventListener('click', () => {
  tabDetails.classList.add('active');
  tabFormats.classList.remove('active');
  panelBody.hidden = false;
  formatsBody.hidden = true;
});
tabFormats.addEventListener('click', () => {
  tabFormats.classList.add('active');
  tabDetails.classList.remove('active');
  panelBody.hidden = true;
  formatsBody.hidden = false;
});

copyBtn.addEventListener('click', () => {
  if (!lastSummary) return;
  navigator.clipboard.writeText(lastSummary);
  const original = copyBtn.textContent;
  copyBtn.textContent = 'Copied';
  setTimeout(() => { copyBtn.textContent = original; }, 1200);
});
openBtn.addEventListener('click', () => {
  if (lastUrl) window.open(lastUrl, '_blank');
});
resetBtn.addEventListener('click', () => {
  urlInput.value = '';
  resultWrap.classList.remove('show');
  errorEl.classList.remove('show');
  urlInput.focus();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;
  lastUrl = url;

  errorEl.classList.remove('show');
  setLoading(true);

  try {
    const res = await fetch(`/api/check?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');

    const best = data.best || {};
    document.getElementById('frameAddr').textContent = data.author ? `@${data.author}` : 'tiktok.com';
    const thumb = document.getElementById('thumb');
    thumb.src = data.thumbnail || '';
    document.getElementById('fileName').textContent = data.title || (best.ext ? `clip.${best.ext}` : 'clip');

    document.getElementById('resolution').textContent = best.resolution || '–';
    document.getElementById('fps').textContent = fmtFps(best.fps);
    document.getElementById('vcodec').textContent = best.vcodec || '–';
    document.getElementById('acodec').textContent = best.acodec || '–';
    document.getElementById('bitrate').textContent = fmtBitrate(best.bitrate_kbps);
    document.getElementById('filesize').textContent = best.filesize_human || 'not reported';
    document.getElementById('duration').textContent = fmtDuration(data.duration_seconds);
    document.getElementById('ext').textContent = (best.ext || '–').toUpperCase();

    if (!best.fps && best.play_url) {
      const fpsEl = document.getElementById('fps');
      const debugEl = document.getElementById('fpsDebug');
      fpsEl.textContent = 'measuring…';
      debugEl.style.display = 'none';
      measureFpsFromVideo(best.play_url).then(({ fps: measured, reason }) => {
        fpsEl.textContent = measured ? fmtFps(measured) : 'not reported';
        lastSummary = lastSummary.replace(/Frame rate: .*/, `Frame rate: ${measured ? fmtFps(measured) : 'not reported'}`);
        if (!measured) {
          debugEl.textContent = `debug: ${reason}`;
          debugEl.style.display = 'block';
        }
      });
    }

    formatsBody.innerHTML = '';
    (data.formats || []).forEach(f => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="label">${f.resolution || '?'}</span><span class="value">${fmtFps(f.fps)}, ${fmtBitrate(f.bitrate_kbps)}</span>`;
      formatsBody.appendChild(row);
    });
    document.getElementById('formatsCount').textContent = (data.formats || []).length;

    lastSummary = [
      data.title, data.author ? `@${data.author}` : '',
      `Resolution: ${best.resolution || '–'}`,
      `Frame rate: ${fmtFps(best.fps)}`,
      `Video codec: ${best.vcodec || '–'}`,
      `Audio codec: ${best.acodec || '–'}`,
      `Bitrate: ${fmtBitrate(best.bitrate_kbps)}`,
      `File size: ${best.filesize_human || 'not reported'}`,
      `Length: ${fmtDuration(data.duration_seconds)}`,
      `Container: ${(best.ext || '–').toUpperCase()}`
    ].filter(Boolean).join('\n');

    resultWrap.classList.add('show');
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('show');
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
